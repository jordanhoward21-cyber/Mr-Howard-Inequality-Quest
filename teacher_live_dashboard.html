<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mr. Howard — Live Class Dashboard</title>
<style>body{font-family:Arial;background:#0b0d10;color:#fff;padding:24px}.card{max-width:1200px;margin:auto;background:#151922;border:1px solid #3b4353;border-radius:16px;padding:20px}button,input{padding:10px;border-radius:9px;border:0}button{background:#d7ff00;font-weight:800}input{width:70%}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:9px;border-bottom:1px solid #333;text-align:left}th{color:#d7ff00}.metric{display:inline-block;margin:5px;padding:10px;background:#0d1118;border-radius:10px}</style></head><body><div class="card"><h1>📊 Live Inequality Quest Dashboard</h1><p>Paste the Google Apps Script <b>/exec</b> URL, then refresh.</p><input id="url" placeholder="https://script.google.com/macros/s/.../exec"><button onclick="load()">LOAD</button><button onclick="load()">REFRESH</button><div id="summary"></div><div id="out"></div></div><script>
async function load(){let u=document.getElementById("url").value.trim();if(!u)return alert("Enter the /exec URL");localStorage.setItem("ineqDashboardUrl",u);try{let r=await fetch(u);let rows=await r.json();rows.sort((a,b)=>b.score-a.score);let complete=rows.filter(x=>x.status==="completed").length;let avg=rows.length?Math.round(rows.reduce((s,x)=>s+(Number(x.accuracy)||0),0)/rows.length):0;document.getElementById("summary").innerHTML=`<div class="metric">Students: <b>${rows.length}</b></div><div class="metric">Completed: <b>${complete}</b></div><div class="metric">Avg. Accuracy: <b>${avg}%</b></div>`;document.getElementById("out").innerHTML="<table><tr><th>#</th><th>Student</th><th>Class</th><th>Score</th><th>Level</th><th>Accuracy</th><th>Streak</th><th>Status</th></tr>"+rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.classCode)}</td><td>${x.score}</td><td>${x.level}</td><td>${x.accuracy}%</td><td>${x.bestStreak}</td><td>${esc(x.status)}</td></tr>`).join("")+"</table>"}catch(e){alert("Could not load dashboard data. Check the /exec URL and deployment access.")}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
document.getElementById("url").value=localStorage.getItem("ineqDashboardUrl")||"";
</script></body></html>
